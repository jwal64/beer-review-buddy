name: Pages

# Merging to main puts a change into Lovable, not onto Lovable's live site —
# that only moves when someone clicks Publish there, and nothing in this repo
# can click it. So this publishes main to GitHub Pages on every push, at
# https://jwal64.github.io/beer-review-buddy/ (the app) and
# https://jwal64.github.io/beer-review-buddy/stats/ (the stats site). No
# account or secret beyond GitHub's own token.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". Until then the deploy step fails and says so.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Never publish what the checks would refuse: a stale snapshot or a
      # beer with no logo would go live exactly as committed.
      - name: Data checks
        run: npm run check

      - name: Install
        run: npm ci || npm install

      - name: Build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npx vite build -c vite.pages.config.ts

      # The shell is the page for every route. Each route also gets its own
      # index.html so a deep link answers 200; 404.html catches the rest.
      - name: Assemble site
        run: |
          out=.output/public
          cp "$out/_shell.html" "$out/index.html"
          cp "$out/_shell.html" "$out/404.html"
          for r in add beers insights map; do
            mkdir -p "$out/$r" && cp "$out/_shell.html" "$out/$r/index.html"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
