name: Logo audit

# TEMPORARY — this file is the audit workflow, borrowed for one run.
#
# Fetching a hundred logos needs open internet, and the sandbox this branch is
# being developed in cannot reach any of the logo services. `workflow_dispatch`
# only offers workflows that exist on the default branch, so the fetch borrows
# this one to get onto a runner. The real audit workflow comes back in the same
# branch, before anything is merged.

on:
  schedule:
    - cron: '0 10 1 * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      # The eight whose own sites answer nothing at all to a datacentre IP.
      # Nothing else has ever had anything to offer for them: every favicon
      # service had nothing to pass on either, and Icon Horse's grey capital
      # was the only thing left. Wikidata's P154 is their last real source.
      - name: Fetch the eight from Wikidata
        run: |
          node tools/fetch-logos.mjs --force --prefer-wikidata --only "$(cat <<'EOF' | tr '\n' ',' | sed 's/,$//'
          Affligem Tripel
          Almaza Pilsener
          Mahou Cinco Estrellas
          Mythos
          Newcastle Brown Ale
          Pacífico Clara
          Singha
          Smithwick's
          EOF
          )"

      - name: Commit what it found
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stats/logos public/stats/data.js logo-fetch-report.json
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Fetch the remaining logos from each brand's encyclopaedia entry"
          git push origin HEAD:${{ github.ref_name }}
