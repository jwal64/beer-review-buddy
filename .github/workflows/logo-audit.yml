name: Logo audit

# TEMPORARY — borrowed for one more run, then restored.
#
# The previous run found that only grupomodelo.com serves a real icon
# (200×200, agreed by three independent services), while modelousa.com — the
# beer brand's own site — has one at 32×32, below the fetcher's floor.
#
# grupomodelo.com is the brewery's corporate domain, and CLAUDE.md forbids a
# parent company's domain as a fallback, because a plausible-looking wrong
# logo is worse than none. That rule is about the *picture*, so the only way
# to settle it is to look at the picture. This prints the candidates as
# base64 into the log, where they can be decoded and viewed without adding an
# unverified domain to data.js first.
#
# It writes nothing to the repo.

on:
  schedule:
    - cron: '0 10 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Print the candidate marks as base64
        run: |
          emit () {   # name url
            curl -sSL --max-time 25 -o /tmp/c.bin "$2" || { echo "$1: unreachable"; return; }
            sz=$(stat -c%s /tmp/c.bin)
            echo "===BEGIN $1 ($sz bytes) $(file -b --mime-type /tmp/c.bin)"
            if [ "$sz" -lt 220000 ]; then base64 -w 200 /tmp/c.bin; else echo "(too big to print)"; fi
            echo "===END $1"
          }

          emit grupomodelo-256 "https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://grupomodelo.com&size=256"
          emit modelousa-256   "https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://modelousa.com&size=256"
          emit modelo-iconhorse "https://icon.horse/icon/modelo.com"

          # And the og:image modelousa.com declares — rejected only for being
          # non-square, which a wide wordmark banner would also be.
          curl -sSL --max-time 25 -o /tmp/p.html https://www.modelousa.com/ || true
          og=$(tr '\n' ' ' < /tmp/p.html | grep -oiP '<meta[^>]+property="og:image"[^>]+content="\K[^"]+' | head -1)
          echo "og:image url = ${og:-(none)}"
          [ -n "$og" ] && emit modelousa-ogimage "$og"
