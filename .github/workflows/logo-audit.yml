name: Logo audit

# TEMPORARY — this file is the audit workflow, borrowed for one run.
#
# Fetching a hundred logos needs open internet, and the sandbox this branch is
# being developed in cannot reach any of the logo services. `workflow_dispatch`
# only offers workflows that exist on the default branch, so the fetch borrows
# this one to get onto a runner. The real audit workflow comes back in the same
# branch, before anything is merged.

on:
  schedule:
    - cron: '0 10 1 * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      # Two whose domain was simply wrong: ichnusa.com is not the beer's site
      # (birraichnusa.it is), and solbeer.com answered with a blue arrow that
      # is nobody's lager.
      - name: Re-fetch the two with corrected domains
        run: node tools/fetch-logos.mjs --force --only "Ichnusa Anima Sarda,Sol"

      # The rest fall into two groups that want the same treatment. Some have
      # sites that answer nothing at all to a datacentre IP; the others have
      # sites that answer with the wrong thing — the WordPress W, a photograph
      # of a man holding a bottle, a picture of a full glass. Either way the
      # encyclopaedia's logo beats the site's, so it goes first for these.
      - name: Fetch the rest from Wikidata first
        run: |
          node tools/fetch-logos.mjs --force --prefer-wikidata --only "$(cat <<'EOF' | tr '\n' ',' | sed 's/,$//'
          Affligem Tripel
          Almaza Pilsener
          Augustiner Helles
          Bitburger Radler
          Estrella Jalisco
          Magna
          Mahou Cinco Estrellas
          Modelo Especial
          Modelo Oro
          Mythos
          Negra Modelo
          Newcastle Brown Ale
          Pacífico Clara
          Pub Ale
          Singha
          Smithwick's
          Super Bock
          Tuborg
          EOF
          )"

      - name: Commit what it found
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stats/logos public/stats/data.js logo-fetch-report.json
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Fetch the remaining logos from each brand's encyclopaedia entry"
          git push origin HEAD:${{ github.ref_name }}
