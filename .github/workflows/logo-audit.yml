name: Logo audit

# TEMPORARY — borrowed again, for one run, exactly as the note below describes.
#
# The three Modelo beers list one domain, modelousa.com, and the fetcher has
# now walked all seven tiers against it and come back with nothing usable:
# no declared icon, an og:image that is not square, a header "logo" that is a
# JPEG photograph, and silence from every favicon service. The question this
# run answers is which domain Modelo's mark actually lives on, so that the
# domain in BRAND_DOMAINS can be corrected rather than guessed at — a guessed
# domain is how a brand ends up wearing another company's logo.
#
# It writes nothing. It only reports what each candidate serves.

on:
  schedule:
    - cron: '0 10 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Ownership first. A domain that serves a logo is no use if the logo is
      # not Modelo's, so print where each candidate lands and what it calls
      # itself before asking any source for a picture.
      - name: Who owns these domains
        run: |
          for d in modelousa.com modelo.com grupomodelo.com gmodelo.com.mx \
                   cervezamodelo.com.mx negramodelo.com modelooro.com \
                   modeloespecial.com corona.com; do
            out=$(curl -sSL --max-time 20 -o /tmp/page.html \
                  -w '%{http_code} %{url_effective}' "https://$d/" 2>/dev/null) || out="--- unreachable"
            title=$(tr '\n' ' ' < /tmp/page.html 2>/dev/null \
                    | grep -oiP '<title[^>]*>\K.*?(?=</title>)' | head -c 90)
            printf '%-24s %s\n%*s   title: %s\n' "$d" "$out" 24 "" "${title:-(none)}"
          done

      - name: What each candidate actually serves
        run: |
          node tools/probe-logo-sources.mjs \
            modelousa.com modelo.com grupomodelo.com gmodelo.com.mx \
            cervezamodelo.com.mx negramodelo.com modelooro.com || true
