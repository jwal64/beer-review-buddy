name: Logo audit

# TEMPORARY — this file is the audit workflow, borrowed for one run.
#
# Fetching a hundred logos needs open internet, and the sandbox this branch is
# being developed in cannot reach any of the logo services. `workflow_dispatch`
# only offers workflows that exist on the default branch, so the fetch borrows
# this one to get onto a runner. The real audit workflow comes back in the same
# branch, before anything is merged.

on:
  schedule:
    - cron: '0 10 1 * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      # All of them, because what decides the answer has changed: candidates
      # are ranked by resolution now, vector above everything, and every raster
      # has to survive being looked at before it can win. A 180px touch icon
      # that was the best answer under the old rules is not the best answer
      # under these, and a photograph is not an answer at all.
      - name: Fetch every logo again, at the best resolution anyone has
        run: node tools/fetch-logos.mjs --force

      - name: Commit what it found
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stats/logos public/stats/data.js logo-fetch-report.json
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Re-fetch every logo at the best resolution anyone has"
          git push origin HEAD:${{ github.ref_name }}
