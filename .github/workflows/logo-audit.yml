name: Logo audit

# TEMPORARY — this file is the audit workflow, borrowed for one run.
#
# Fetching a hundred logos needs open internet, and the sandbox this branch is
# being developed in cannot reach any of the logo services. `workflow_dispatch`
# only offers workflows that exist on the default branch, so the fetch borrows
# this one to get onto a runner. The real audit workflow comes back in the same
# branch, before anything is merged.

on:
  schedule:
    - cron: '0 10 1 * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      # The eight whose own sites answer nothing to a datacentre IP, and whose
      # stale files have been deleted so the fetch picks them up: they need the
      # Wikidata tier, which identifies the brand by the domain already
      # recorded for it rather than by guessing at a Wikipedia article.
      - name: Fetch the logos that are still missing
        run: node tools/fetch-logos.mjs

      - name: Commit what it found
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stats/logos public/stats/data.js logo-fetch-report.json
          git commit -m "Re-fetch the logos that came back as a letter or a photograph" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
