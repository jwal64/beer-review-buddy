name: Logo audit

# TEMPORARY — this file is the audit workflow, borrowed for one run.
#
# Fetching a hundred logos needs open internet, and the sandbox this branch is
# being developed in cannot reach any of the logo services. `workflow_dispatch`
# only offers workflows that exist on the default branch, so the fetch borrows
# this one to get onto a runner. The real audit workflow comes back in the same
# branch, before anything is merged.

on:
  schedule:
    - cron: '0 10 1 * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      # The eleven with no file: five whose Wikidata item is the right brand
      # but carries no logo, and six no article is named for — Grupo Modelo is
      # not "Modelo Especial". Commons is asked by name for both.
      - name: Fetch the ones with no logo yet
        run: |
          node tools/fetch-logos.mjs --force --only "$(cat <<'EOF' | tr '\n' ',' | sed 's/,$//'
          Affligem Tripel
          Almaza Pilsener
          Mahou Cinco Estrellas
          Modelo Especial
          Modelo Oro
          Mythos
          Negra Modelo
          Newcastle Brown Ale
          Pacífico Clara
          Singha
          Smithwick's
          EOF
          )"

      - name: Commit what it found
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stats/logos public/stats/data.js logo-fetch-report.json
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Re-fetch every logo at the best resolution anyone has"
          # Half an hour of fetching should not be thrown away because somebody
          # pushed a comment to the branch while it ran. Rebase onto whatever
          # is there and try again; the logos are the only thing this commit
          # touches, so there is nothing for it to conflict with.
          for attempt in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            git pull --rebase origin ${{ github.ref_name }}
          done
          echo "could not push after three tries" >&2
          exit 1
