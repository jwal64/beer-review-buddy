name: Fetch logos

# Fetches a logo for every beer that has no file yet, and commits it.
#
# `npm run fetch-logos` needs open internet and a browser, which a laptop has
# and a sandboxed agent session generally does not — the logo services are the
# first thing an egress policy blocks. This is the way to run it anyway.
#
# It is deliberately not scheduled. A beer that has a logo does not need a new
# one, and re-fetching on a timer would let a brand's redesign, or a bad answer
# from a source, quietly replace a logo somebody had already looked at. Run it
# when `npm run check` says a beer has no file.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated beer names to re-fetch (blank = everything missing)'
        required: false
        default: ''
      force:
        description: 'Re-fetch beers that already have a file'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Fetch
        run: |
          ARGS=""
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          [ -n "${{ inputs.only }}" ] && ARGS="$ARGS --only ${{ inputs.only }}"
          node tools/fetch-logos.mjs $ARGS

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stats/logos public/stats/data.js logo-fetch-report.json
          git diff --cached --quiet && { echo "Nothing to commit — every beer already had a logo."; exit 0; }
          git commit -m "Fetch logos for beers that had none"
          # A long fetch should not be thrown away because somebody pushed to
          # the branch while it ran. The logos are all this commit touches, so
          # there is nothing for a rebase to conflict with.
          for attempt in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            git pull --rebase origin ${{ github.ref_name }}
          done
          echo "could not push after three tries" >&2
          exit 1

      # Whatever came back still has to be looked at: nothing here can tell a
      # brand's mark from a photograph of a bottle, and every automated signal
      # tried during this work was fooled at least once. The sheet is an
      # artifact rather than a commit — it goes stale the moment a logo changes.
      - name: Render the contact sheet
        if: always()
        run: npm run logo-sheet

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logo-sheet
          path: logo-sheet.png
