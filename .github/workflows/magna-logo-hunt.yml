name: Magna logo hunt

# TEMPORARY — one-off, deleted in the same branch once Magna has its logo.
#
# Magna is the one beer on cerveceradepr.com with no mark the fetcher's ladder
# can reach: the site declares no icon, so the favicon tier answers with the
# WordPress default (a CMS logo on a beer — the confidently-wrong answer this
# repo keeps warning about), and it has done so twice now. This walks the
# brand's own site looking for the Magna artwork itself and commits every
# candidate to logo-candidates/ so a person can look at them and choose. It
# writes nothing into public/stats/.

on: workflow_dispatch

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Hunt
        run: |
          cat > /tmp/hunt.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { mkdirSync, writeFileSync } from 'node:fs';
          const OUT = 'logo-candidates';
          mkdirSync(OUT, { recursive: true });
          const b = await chromium.launch();
          const page = await b.newPage({ viewport: { width: 1440, height: 2200 } });
          const seen = new Map();
          const roots = ['https://cerveceradepr.com/', 'https://cerveceradepr.com/home/'];
          const visit = async (url) => {
            try { await page.goto(url, { waitUntil: 'networkidle', timeout: 45000 }); }
            catch { console.log('  ! could not load', url); return []; }
            // Every image-ish URL the page actually references, plus link targets.
            return await page.evaluate(() => {
              const out = [];
              const push = (u, why, alt) => u && out.push({ u, why, alt: alt || '' });
              for (const i of document.querySelectorAll('img')) {
                push(i.currentSrc || i.src, 'img', i.alt);
                (i.srcset || '').split(',').forEach(s => push(s.trim().split(/\s+/)[0], 'srcset', i.alt));
              }
              for (const e of document.querySelectorAll('*')) {
                const bg = getComputedStyle(e).backgroundImage;
                const m = bg && bg.match(/url\(["']?(.*?)["']?\)/);
                if (m) push(m[1], 'css-bg', e.className && String(e.className));
              }
              for (const l of document.querySelectorAll('link[rel*="icon"]')) push(l.href, 'declared-icon', l.rel);
              const links = [...document.querySelectorAll('a')].map(a => a.href);
              return { imgs: out, links };
            }).then(r => { r.imgs.forEach(x => seen.set(x.u, x)); return r.links; });
          };
          let links = [];
          for (const r of roots) links = links.concat(await visit(r));
          // Any page whose URL mentions the brand is worth opening too.
          const brandPages = [...new Set(links.filter(h => /magna/i.test(h)))].slice(0, 6);
          console.log('brand pages found:', brandPages);
          for (const p of brandPages) await visit(p);
          // Rank: anything naming the brand first, then anything calling itself a logo.
          const all = [...seen.values()].filter(x => /^https?:/.test(x.u));
          const score = x => (/magna/i.test(x.u + x.alt) ? 100 : 0) + (/logo/i.test(x.u + x.why + x.alt) ? 10 : 0);
          const ranked = all.sort((a, c) => score(c) - score(a)).filter(x => score(x) > 0).slice(0, 25);
          console.log(`${all.length} images seen · ${ranked.length} name the brand or call themselves a logo`);
          let n = 0;
          for (const x of ranked) {
            try {
              const r = await page.request.get(x.u, { timeout: 30000 });
              if (!r.ok()) { console.log('  !', r.status(), x.u); continue; }
              const buf = Buffer.from(await r.body());
              if (buf.length < 200) continue;
              const ext = (x.u.split('?')[0].match(/\.(svg|png|webp|jpe?g|gif|avif)$/i) || [, 'bin'])[1].toLowerCase();
              const name = `${String(++n).padStart(2, '0')}-${score(x)}-${x.why}.${ext}`;
              writeFileSync(`${OUT}/${name}`, buf);
              console.log(`  ✓ ${name}  ${buf.length}b  ${x.u}`);
            } catch (e) { console.log('  !', x.u, e.message); }
          }
          writeFileSync(`${OUT}/_manifest.json`, JSON.stringify(ranked, null, 2) + '\n');
          if (!n) console.log('nothing named the brand — see the screenshot');
          try {
            await page.goto(brandPages[0] || roots[0], { waitUntil: 'networkidle', timeout: 45000 });
            await page.screenshot({ path: `${OUT}/_page.png`, fullPage: true });
          } catch {}
          await b.close();
          EOF
          node /tmp/hunt.mjs

      - name: Commit the candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo-candidates
          git diff --cached --quiet && { echo "nothing found"; exit 0; }
          git commit -m "Magna logo candidates from the brand's own site (temporary)"
          git push origin HEAD:${{ github.ref_name }}
