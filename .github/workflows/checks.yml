name: Data check

# The stats site has no build step, so nothing else would notice a beer added
# with a country code that has no flag, a brewery that was never registered or
# a missing brand domain. This runs the same checks CLAUDE.md asks for —
# including over the pushes Lovable makes to main when the app is edited there.

# A branch push and its pull request are the same commit, so running on both
# checked everything twice and reported one failure as three red crosses. The
# pull request is where a branch is read, and main is where Lovable pushes —
# between them every commit that reaches the site is still checked once.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push supersedes the first; only main's history is worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, not 20: Node 20 went end-of-life in April 2026, and the app-logic
      # test imports src/lib/place.ts directly — 22 strips the types itself,
      # which is what lets one test hold the app's copy of the location format
      # against the site's without a build step to run first.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No dependencies to install — the tools are plain Node.
      - name: Validate the data
        run: node tools/validate-data.mjs

      # data.js goes out through the database columns and back; a value that
      # does not survive is what a migration would quietly write wrong.
      - name: Check the Supabase projection round-trips
        run: node tools/roundtrip-supabase.mjs

      # npm never reads bun.lock, so a forgotten `bun install` used to pass
      # everything here and fail Lovable's build after the merge instead.
      - name: Check bun.lock is in step with package.json
        run: node tools/check-lockfile.mjs

      # Two features have been reverted twice by a pass that never meant to
      # touch them. This fails on the push that drops them, not weeks later.
      # It also checks that every tool in `npm run check` has a step below.
      - name: Check the standing features are still in place
        run: node tools/check-invariants.mjs

      # The verifier that notices an unapplied migration, held against a
      # database made wrong in each way that has actually happened. It was
      # named in the check script and run by nothing here until now.
      - name: Test the live-sync comparison
        run: node tools/verify-live-test.mjs

      # The rules inside app.js — the location format, when two spellings are
      # the same beer, MIN_N, the canonical location, the shortlist's guess.
      # Nothing else asks whether the code that renders the data still behaves.
      - name: Test the stats-site logic
        run: node tools/app-logic-test.mjs

      - name: Syntax-check the site scripts
        run: node --check public/stats/data.js && node --check public/stats/app.js && node --check public/stats/live-data.js
