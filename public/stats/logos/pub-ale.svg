<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Boddingtons Pub Ale, the Cream of Manchester">
  <rect width="512" height="512" rx="60" fill="#e0a526"/>
  <!-- the Manchester worker bee Boddingtons is known by -->
  <g fill="#1c1206">
    <ellipse cx="256" cy="188" rx="46" ry="58"/>
    <circle cx="256" cy="122" r="26"/>
    <rect x="238" y="86" width="6" height="26" rx="3" transform="rotate(-22 241 99)"/>
    <rect x="268" y="86" width="6" height="26" rx="3" transform="rotate(22 271 99)"/>
  </g>
  <g fill="#e0a526">
    <rect x="214" y="168" width="84" height="11" rx="5"/>
    <rect x="214" y="196" width="84" height="11" rx="5"/>
    <rect x="222" y="224" width="68" height="11" rx="5"/>
  </g>
  <g fill="#fdf2d6" opacity="0.92">
    <ellipse cx="180" cy="150" rx="42" ry="22" transform="rotate(-28 180 150)"/>
    <ellipse cx="332" cy="150" rx="42" ry="22" transform="rotate(28 332 150)"/>
