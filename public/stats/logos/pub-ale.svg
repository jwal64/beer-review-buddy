    <text x="256" y="410" font-size="52" fill="#1c1206" letter-spacing="6">PUB ALE</text>
    <text x="256" y="458" font-size="25" fill="#5a4114" letter-spacing="2">THE CREAM OF MANCHESTER</text>
  </g>
